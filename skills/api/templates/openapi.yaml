# Template for `api`. Copy it to docs/features/<slug>/contracts/openapi.yaml, then DERIVE:
#   fields + constraints  ← data-model.md (each field comes from a column; copy maxLength/pattern/enum)
#   error responses       ← sad.md §6 sequence alt-branches (one response for each branch)
#   endpoint list + shape ← spec.md §4 user stories / §5 acceptance criteria
# Replace each <...>. Keep the conventions below (3.1, BearerAuth, cursor page,
# {code,message,details?} envelope). Schema NAMES use the domain language from data-model.md.
# Never use a Go/TS/Python idiom. Never use the error type of a driver.
openapi: 3.1.0

info:
  title: <Feature> API
  version: 0.1.0
  # One paragraph from spec.md §1: WHY this API exists. Then a consumer (a different team, an AI)
  # reads the purpose, not only the shape. Increase `version` only with an explicit CHANGELOG line.
  # Never increase it silently.
  description: |
    <why this API exists — one paragraph from spec.md §1>

servers:
  - url: https://api.example.com
    description: Production
  - url: http://localhost
    description: Local

# Global default: each operation must have a bearer token. An operation can override this with `security: []`.
security:
  - BearerAuth: []

paths:
  # One block for each endpoint. One endpoint (or more) for each spec §4 user story. Lists use cursor pagination.
  /api/v1/<resources>:
    get:
      summary: <list ...>
      operationId: list<Resources>
      parameters:
        - in: query
          name: after
          description: cursor — the id of the last item that the client saw. The page starts after it
          schema: { type: string, format: uuid }
        - in: query
          name: before
          schema: { type: string, format: uuid }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/<Resource>Page" }
        # One response for each error branch in the sad.md §6 alt-block of this flow (for example, 401 from BearerAuth).
        "401":
          $ref: "#/components/responses/Error"

    post:
      summary: <create ...>
      operationId: create<Resource>
      parameters:
        # The operation changes data and can be retried (a §6 flow shows a retry note / async actor) ⇒ Idempotency-Key is necessary.
        - in: header
          name: Idempotency-Key
          required: true
          description: a key that the client makes. On a retry, the server returns the first result (TTL <N>h)
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/<Resource>Create" }
            example:
              # only placeholder data — never real PII
              title: "Test <Resource>"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/<Resource>" }
        # Each other response = one alt-branch from sad.md §6 (validation / authorization / conflict).
        "409":
          description: <conflict — name the invariant, e.g. duplicate slug>
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: "<module>.<error_name>"   # neutral snake_case convention
                message: "<human-readable reason>"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Error:
      description: Error — unified envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    # Unified error envelope. `code` is the neutral `module.error_name` convention (a naming rule,
    # not a language artifact). It must exist in the error definitions of the repo (drift point 2).
    Error:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: "^[a-z_]+\\.[a-z_]+$"
          example: "<module>.<error_name>"
        message: { type: string }
        details:
          type: object
          description: optional structured context (field errors, conflicting id, …)

    # One schema for each data-model.md entity. Each property comes from a column. Copy its constraints.
    <Resource>:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        # Bounded text → maxLength from the varchar(N) of the model. Nullable → type: [string, null].
        title: { type: string, maxLength: 200 }
        # Closed set → enum from the enumerated type of the model.
        status: { type: string, enum: [<value_a>, <value_b>] }
        # Nullable column — 3.1 style, NOT `nullable: true`.
        description: { type: [string, "null"] }
        created_at: { type: string, format: date-time }

    <Resource>Create:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title: { type: string, maxLength: 200 }

    # Cursor page wrapper for each list response. Never offset.
    <Resource>Page:
      type: object
      required: [items, has_next, has_prev]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/<Resource>" }
        has_next: { type: boolean }
        has_prev: { type: boolean }
        next_cursor: { type: [string, "null"], format: uuid }
